receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
    send_batch_size: 512

exporters:
  otlphttp:
    endpoint: "https://otlp-gateway-prod-ap-south-1.grafana.net/otlp"
    headers:
      # NEW TOKEN (updated 2026-02-17)
      Authorization: "Basic MTUyNzk4NTpnbGNfZXlKdklqb2lNVFkzTVRFNE1DSXNJbTRpT2lKbWFYSnpkQ0lzSW1zaU9pSlJjak15U1ZGTE5UUk5NRGhWT1VNeGIyWkVUelpOWXpBaUxDSnRJanA3SW5JaU9pSndjbTlrTFdGd0xYTnZkWFJvTFRFaWZYMD0="
    tls:
      insecure: false

  debug:
    verbosity: detailed

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp, debug]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp, debug]